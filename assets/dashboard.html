<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { color-scheme: light dark; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font: 12px/1.45 -apple-system, "SF Pro Text", sans-serif;
  width: 420px; padding: 14px; overflow-x: hidden;
  background: transparent; color: CanvasText;
}
.sec { font-size: 10px; letter-spacing: .4px; color: GrayText; margin-bottom: 3px; }
.hdr { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.hdr .dot { margin-left: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #30d158; display: inline-block; }
.live-tag { color: GrayText; font-size: 11px; }
.big { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv { display: flex; gap: 14px; color: GrayText; font-size: 11px; margin-top: 2px; }
.kv b { color: CanvasText; font-weight: 500; }
.src { color: DarkGray; margin-top: 2px; }
.card { background: rgba(48,209,88,.10); border-radius: 8px; padding: 8px; margin: 6px 0; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin: 8px 0 4px; }
.col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; height: 100%; }
.bar { border-radius: 1.5px; background: AccentColor; opacity: .55; min-height: 0; }
.bar.now { opacity: 1; }
.bar.future { background: GrayText; opacity: .15; }
.bar.remote { background: #bf5af2; opacity: .55; }
.bar.remote.now { opacity: .9; }
.rowline { display: flex; justify-content: space-between; font-size: 11px; padding: 1px 0; }
.rowline .l { color: GrayText; }
.mono { font-variant-numeric: tabular-nums; }
.item { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 1px 0; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .v { margin-left: auto; color: GrayText; font-variant-numeric: tabular-nums; }
.tag { font-size: 9px; color: GrayText; border: 1px solid rgba(128,128,128,.4); border-radius: 3px; padding: 0 3px; }
.machines { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: GrayText; margin-top: 6px; }
.machines .bad { color: #ff453a; }
div.sep { border-top: 1px solid rgba(128,128,128,.25); margin: 10px 0; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 10px; color: DarkGray; }
a.quit { color: AccentColor; text-decoration: none; cursor: pointer; }
.legend { display: flex; gap: 10px; font-size: 9px; color: GrayText; }
.legend span { display: flex; align-items: center; gap: 3px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tip {
  position: fixed; display: none; z-index: 99; pointer-events: none;
  background: rgba(30,30,32,.94); color: #f2f2f2; border-radius: 6px;
  padding: 5px 8px; font-size: 10.5px; line-height: 1.5; white-space: pre-line;
  box-shadow: 0 2px 10px rgba(0,0,0,.35); max-width: 300px;
  font-variant-numeric: tabular-nums;
}
[data-tip] { cursor: default; }
/* thin overlay scrollbar: transparent track, faint thumb, widens on hover */
::-webkit-scrollbar { width: 5px; height: 0; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(128,128,128,.22); border-radius: 3px;
  transition: background .15s;
}
::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,.45); }
::-webkit-scrollbar-corner { background: transparent; }
.item { border-radius: 5px; padding: 1px 4px; margin: 0 -4px; }
.item:hover { background: rgba(128,128,128,.12); }
</style>
</head>
<body>
<div class="hdr">Joule <span class="dot"></span><span class="live-tag" id="livecount"></span></div>
<div id="live"></div>
<div style="margin-top:10px">
  <div class="sec">TODAY <span id="srcsplit" class="src"></span></div>
  <div class="big" id="today">0</div>
  <div class="kv" id="todaykv"></div>
</div>
<div class="chart" id="hours"></div>
<div class="sec">LAST 14 DAYS</div>
<div class="chart" style="height:44px" id="days"></div>
<div class="legend"><span><i style="background:AccentColor;opacity:.55"></i>this mac</span><span><i style="background:#bf5af2"></i>remotes</span></div>
<div class="sep"></div>
<div id="sums"></div>
<div class="sep"></div>
<div class="sec">TOP SESSIONS TODAY</div>
<div id="sessions"></div>
<div class="sep"></div>
<div class="sec">PROJECTS TODAY</div>
<div id="projects"></div>
<div class="sep"></div>
<div class="sec">MODELS TODAY</div>
<div id="models"></div>
<div class="machines" id="machines"></div>
<div class="foot"><span id="path">~/.config/joule</span><a class="quit" id="quit">Quit</a></div>
<div class="tip" id="tip"></div>
<script>
const $ = id => document.getElementById(id);
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(1)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : ''+n;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip = $('tip');

$('quit').onclick = () => window.webkit.messageHandlers.action.postMessage('quit');

// custom tooltip: follows the cursor, reads data-tip off whatever is under it
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 12, y = e.clientY + 14;
  if (x + w > window.innerWidth - 6) x = e.clientX - w - 10;
  if (y + h > window.innerHeight - 6) y = e.clientY - h - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

const statTip = s => 'in ' + fmt(s.input) + ' · out ' + fmt(s.output) +
  ' · cache ' + fmt(s.cache) + '\n' + s.reqs.toLocaleString() + ' requests';
const sessTip = s => s.title + '\n' + statTip(s) + (s.machine !== 'mac' ? ' · ' + s.machine : '');

function render(S) {
  $('today').textContent = fmt(S.today.input_tokens + S.today.output_tokens);
  $('srcsplit').textContent = '  ' + S.machines.map(m => m.name + ' ' + fmt(m.today_in_out)).join(' · ');
  $('todaykv').innerHTML =
    '<span>in <b>' + fmt(S.today.input_tokens) + '</b></span>' +
    '<span>out <b>' + fmt(S.today.output_tokens) + '</b></span>' +
    '<span>cache <b>' + fmt(S.today.cache_read_tokens) + '</b></span>' +
    '<span>reqs <b>' + S.today.requests + '</b></span>';

  $('live').innerHTML = S.live.length
    ? '<div class="card"><div class="sec"><span class="dot"></span> LIVE NOW</div>' +
      S.live.map(s => '<div class="item" data-tip="' + esc(sessTip(s)) + '"><span class="t">' + esc(s.title) + '</span>' +
        (s.machine !== 'mac' ? '<span class="tag">'+esc(s.machine)+'</span>' : '') +
        '<span class="v">' + fmt(s.in_out) + '</span></div>').join('') + '</div>'
    : '';
  $('livecount').textContent = S.live.length ? S.live.length + ' live' : '';

  // hourly chart: stacked this-mac / remotes, same legend as the 14-day chart
  const nowH = new Date().getHours();
  const hmax = Math.max(1, ...S.hours_local.map((v, i) => v + S.hours_remote[i]));
  $('hours').innerHTML = S.hours_local.map((lv, i) => {
    const rv = S.hours_remote[i] || 0, tot = lv + rv;
    const cls = i === nowH ? ' now' : i > nowH ? ' future' : '';
    const t = String(i).padStart(2,'0') + ':00 – ' + String((i+1)%24).padStart(2,'0') + ':00\n' +
      'this mac ' + fmt(lv) + ' · remotes ' + fmt(rv) + '\ntotal ' + fmt(tot);
    return '<div class="col" data-tip="' + esc(t) + '">' +
      '<div class="bar remote' + cls + '" style="height:' + (30 * rv / hmax) + 'px;min-height:' + (rv ? 2 : 0) + 'px"></div>' +
      '<div class="bar' + cls + '" style="height:' + (30 * lv / hmax) + 'px;min-height:' + (lv ? 2 : 0) + 'px"></div></div>';
  }).join('');

  const dmax = Math.max(1, ...S.days14.map(d => d.local + d.remote));
  $('days').innerHTML = S.days14.map(d => {
    const t = d.date + '\nthis mac ' + fmt(d.local) + ' · remotes ' + fmt(d.remote) +
      '\ntotal ' + fmt(d.local + d.remote);
    return '<div class="col" data-tip="' + esc(t) + '">' +
      '<div class="bar remote" style="height:' + (42 * d.remote / dmax) + 'px;min-height:' + (d.remote ? 2 : 0) + 'px"></div>' +
      '<div class="bar" style="height:' + (42 * d.local / dmax) + 'px;min-height:' + (d.local ? 2 : 0) + 'px"></div></div>';
  }).join('');

  $('sums').innerHTML =
    sumrow('This week', S.week) + sumrow('All time', S.all_time);

  $('sessions').innerHTML = S.top_sessions.length ? S.top_sessions.map(s =>
    '<div class="item" data-tip="' + esc(sessTip(s)) + '">' + (s.live ? '<span class="dot" style="width:5px;height:5px"></span>' : '') +
    '<span class="t">' + esc(s.title) + '</span>' +
    (s.machine !== 'mac' ? '<span class="tag">' + esc(s.machine) + '</span>' : '') +
    '<span class="v">' + fmt(s.in_out) + '</span></div>').join('')
    : '<div class="item" style="color:GrayText">no sessions yet</div>';

  $('projects').innerHTML = S.projects.length ? S.projects.map(s =>
    '<div class="item" data-tip="' + esc(s.name + '\n' + statTip(s)) + '"><span class="t">' + esc(s.name) +
    '</span><span class="v">' + fmt(s.in_out) + '</span></div>').join('')
    : '<div class="item" style="color:GrayText">none</div>';

  $('models').innerHTML = S.models.map(s =>
    '<div class="item" data-tip="' + esc(s.name + '\n' + statTip(s)) + '"><span class="t">' + esc(s.name) +
    '</span><span class="v">' + fmt(s.in_out) + '</span></div>').join('');

  $('machines').innerHTML = S.machines.map(m => {
    const t = m.error ? m.name + ' — ' + m.error
      : m.name + ' — ok' + (m.stale_secs != null ? ', last poll ' + Math.round(m.stale_secs) + 's ago' : '') +
        '\ntoday ' + fmt(m.today_in_out);
    return '<span' + (m.error ? ' class="bad"' : '') + ' data-tip="' + esc(t) + '">' +
      esc(m.name) + ' ' + (m.error ? '✗' : '✓') +
      (m.stale_secs != null ? ' ' + Math.round(m.stale_secs) + 's' : '') + '</span>';
  }).join('');
}
function sumrow(l, s) {
  return '<div class="rowline"><span class="l">' + l + '</span><span class="mono">' +
    fmt(s.input_tokens) + ' in · ' + fmt(s.output_tokens) + ' out · ' + fmt(s.cache_read_tokens) + ' cache</span></div>';
}
</script>
</body>
</html>
