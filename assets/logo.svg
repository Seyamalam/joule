<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".55" stop-color="#4c2fd1"/>
      <stop offset="1" stop-color="#241257"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="60" x2="0" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdbfff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#a78bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#160a3a" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- macOS-style squircle -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- faint gauge arc behind the bolt -->
  <path d="M118 334 A152 152 0 0 1 394 334" fill="none"
        stroke="#ffffff" stroke-opacity=".16" stroke-width="16"
        stroke-linecap="round"/>
  <circle cx="394" cy="334" r="13" fill="#ffffff" fill-opacity=".34"/>

  <!-- the bolt: a lightning J -->
  <path filter="url(#shadow)" fill="url(#bolt)"
        d="M296 66 L156 276 h84 L206 446 L366 226 h-86 L330 66 Z"/>
</svg>
